      <h2>Preguntas frecuentes</h2>
      <dl>
        <dt>¿Puedo pedir o pagar en esta página?</dt>
        <dd>No. El sitio sirve para conocer la marca, el menú, las combinaciones y las sucursales. Los pedidos se hacen en la app BeanCraft y se pagan en el mostrador al recoger.</dd>
        <dt>¿Qué es el precio de referencia?</dt>
        <dd>Es la suma de la bebida base más el tamaño, la leche, el endulzante y los extras que elijas. Los cupones se aplican en la app y pueden bajar el total.</dd>
        <dt>¿Cómo se usa un cupón?</dt>
        <dd>En la app, escaneando el QR del cupón o escribiendo su código. Se acepta un cupón por pedido y cada cupón se usa una vez por cliente.</dd>
        <dt>¿Qué leches y endulzantes tienen?</dt>
        <dd>Leche entera, deslactosada, de avena y de almendra. Endulzantes: azúcar, stevia y miel, o sin endulzante.</dd>
        <dt>¿Hacen envíos a domicilio?</dt>
        <dd>Por ahora no. Todo se recoge en sucursal.</dd>
        <dt>Trabajo en BeanCraft, ¿dónde entro?</dt>
        <dd>Usa “Iniciar sesión” en la parte superior. El acceso es solo para administradores y personal de sucursal.</dd>
      </dl>
      <p>Los pedidos se hacen en la app BeanCraft y se pagan al recoger. ¿Trabajas en BeanCraft? El acceso del personal requiere JavaScript.</p>
