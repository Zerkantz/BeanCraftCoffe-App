<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BeanCraft Coffee — App Móvil</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="polish.css">
</head>
<body>
  <a class="skip-link" href="#mainViewport">Saltar al contenido</a>

  <div class="app-shell" id="appShell">
    <main class="viewport" id="mainViewport" tabindex="-1">

      <section class="view active" id="view-home" aria-label="Inicio"><div id="homeContent" class="pad"></div>        <section class="hero-armador" id="heroCarousel" aria-roledescription="carousel" aria-label="Armador de bebidas destacadas">
          <div class="hero-copy">
            <h1 class="titulo-mixto hero-h1">Arma tu bebida, <em>tú</em> mandas</h1>
            <p class="hero-sub">Elige, personaliza y agrega tu bebida al carrito.</p>
          </div>
          <div class="hero-stage-wrap">
            <span class="etiqueta-desc rot-neg hero-tag-left">-20%</span>
            <span class="etiqueta-nueva rot-pos hero-tag-right">¡Nuevo!</span>
            <div class="hero-mascot-left" id="heroMascotLeft" aria-hidden="true"></div>
            <div class="hero-mascot-right" id="heroMascotRight" aria-hidden="true"></div>
            <div class="hero-mascot-top" id="heroMascotTop" aria-hidden="true"></div>

            <div class="lh-stage" id="heroStage" role="group" aria-roledescription="slide" aria-label="Frappé Supremo">
              <svg class="lh-orbit-svg" viewBox="0 0 360 110" aria-hidden="true">
                <ellipse cx="180" cy="82" rx="146" ry="22" fill="var(--c-menta)" stroke="var(--c-tostado)" stroke-width="2"/>
                <ellipse cx="180" cy="82" rx="92" ry="12" fill="var(--c-espuma)" stroke="var(--c-tostado)" stroke-width="1.5" stroke-dasharray="5 4"/>
              </svg>
              <div class="lh-ring" id="heroRing"></div>
            </div>

            <div class="lh-controls">
              <button type="button" class="lh-arr" id="heroPrevBtn" aria-label="Bebida anterior">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
              </button>
              <span class="lh-hint">Gira o toca tu bebida</span>
              <button type="button" class="lh-arr" id="heroNextBtn" aria-label="Siguiente bebida">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
              </button>
            </div>
          </div>

          <div class="hero-pick"><h2 id="heroTitle"></h2><p id="heroPrice"></p><button class="btn-primary" id="heroOrderBtn">Pedir ya</button><button class="link" data-nav="menu">Ver todo el menú</button></div>
          <p class="visually-hidden" id="heroLive" role="status" aria-live="polite"></p>
        </section>

<div id="homePromos" class="pad"></div><section id="houseSection" class="home-section" aria-label="Bebidas de la casa"></section><section id="quizContainer" class="home-section" aria-label="Quiz de bebidas"></section><footer id="homeFooter" class="home-footer"></footer></section>
      <section class="view" id="view-menu" aria-label="Explorar menú" hidden>
        <div class="menu-crystal-bg">
          <div class="pad">
            <header class="topbar">
              <button type="button" class="rbtn" data-nav="home" aria-label="Volver a inicio">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
              </button>
              <h1 class="titulo-mixto t-center" style="font-size:22px">Nuestro <em>menú</em></h1>
              <button type="button" class="avatar sm" id="menuAvatarBtn" aria-label="Mi cuenta">Inv</button>
            </header>

            <label class="search-box">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--c-tostado)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="menuSearchInput" placeholder="Buscar café, frappé, cold brew o pan...">
            </label>

            <div class="chips" id="menuFilterChips" role="group" aria-label="Filtrar menú por categoría"></div>

</div>

          <div class="cgrid" id="crystalMenuGrid"></div>
        </div>
      </section>
      <section class="view" id="view-cart" aria-label="Carrito de compras" hidden>
        <div class="pad">
          <header class="topbar">
            <button type="button" class="rbtn" data-nav="menu" aria-label="Volver al menú">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
            </button>
            <h1 class="titulo-mixto t-center" style="font-size:22px">Tu <em>carrito</em></h1>
          </header>
        </div>

        <div id="cartContent"></div>
      </section>
      <section class="view" id="view-orders" aria-label="Seguimiento de pedido" hidden>
        <div class="pad">
          <header class="topbar">
            <button type="button" class="rbtn" data-nav="home" aria-label="Volver a inicio">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
            </button>
            <h1 class="titulo-mixto t-center" style="font-size:22px">Mi <em>pedido</em></h1>
          </header>
          <div id="ordersContent"></div>
        </div>
      </section>
      <section class="view" id="view-profile" aria-label="Perfil de usuario" hidden>
        <div id="profileContent"></div>
      </section>

    </main>
    <nav class="nav-wrap" aria-label="Navegación principal">
      <div class="nav">
        <button type="button" class="nav-item on" data-nav="home" aria-current="page">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          <span>Inicio</span>
        </button>
        <button type="button" class="nav-item" data-nav="menu">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2.5v2.5M12 2.5v2.5"/></svg>
          <span>Menú</span>
        </button>
        <button type="button" class="nav-item" data-nav="cart">
          <span class="nav-badge" id="cartBadge" hidden>0</span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11a1 1 0 0 0 1 .8h9.3a1 1 0 0 0 1-.8L20.5 8H6"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
          <span>Carrito</span>
        </button>
        <button type="button" class="nav-item" data-nav="orders">
          <span class="nav-badge dot" id="orderBadge" hidden>!</span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
          <span>Pedido</span>
        </button>
        <button type="button" class="nav-item" data-nav="profile"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3"/></svg><span>Perfil</span></button>
      </div>
    </nav>
  </div>
  <dialog id="customizerDialog" class="sheet-dialog" closedby="any" aria-labelledby="custTitle">
    <div class="dialog-sheet" id="custBody"></div>
  </dialog>

  <dialog id="authDialog" class="sheet-dialog" closedby="any" aria-labelledby="authTitle">
    <div class="dialog-sheet" id="authBody"></div>
  </dialog>

  <dialog id="branchDialog" class="sheet-dialog" closedby="any" aria-labelledby="branchTitle">
    <div class="dialog-sheet" id="branchBody"></div>
  </dialog>

  <dialog id="qrDialog" class="sheet-dialog" closedby="any" aria-labelledby="qrTitle">
    <div class="dialog-sheet" id="qrBody"></div>
  </dialog>

  <dialog id="ratingDialog" class="sheet-dialog" closedby="any" aria-labelledby="ratingTitle">
    <div class="dialog-sheet" id="ratingBody"></div>
  </dialog>

  <dialog id="avatarDialog" class="sheet-dialog" aria-labelledby="avatarTitle"><div class="dialog-sheet" id="avatarBody"></div></dialog>
  <dialog id="notifDialog" class="sheet-dialog" aria-labelledby="notifTitle"><div class="dialog-sheet" id="notifBody"></div></dialog>
  <script src="vendor/anime.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
