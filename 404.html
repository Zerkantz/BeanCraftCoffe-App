<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · BeanCraft Coffee</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/mascotas/grano.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/componentes.css">
<script>
  // Alojamientos estáticos (GitHub Pages, Netlify): una ruta desconocida vuelve a la app, que muestra su 404 o la pantalla pedida.
  (function () {
    var ruta = location.pathname.replace(/\/+$/, '').split('/').pop();
    location.replace('./#/' + (ruta && ruta !== '404.html' ? ruta : 'no-existe'));
  })();
</script>
</head>
<body>
<main class="sin-js">
  <h1>Esta página se nos enfrió.</h1>
  <p>Puede que el enlace esté mal escrito o que la página ya no exista.</p>
  <p><a href="./#/">Volver al inicio de BeanCraft Coffee</a></p>
</main>
</body>
</html>
